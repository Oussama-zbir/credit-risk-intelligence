name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image's interpreter and pins, so the artifact trained here loads in it.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest -c constraints.txt

      - name: Build image
        run: docker build -t credit-risk-service .

      - name: Smoke test (synthetic artifact, then a tampered one)
        run: scripts/container_smoke.sh credit-risk-service
